<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <button id="theme-toggle" type="button" aria-pressed="false">Modo claro</button>

    <div class="game-area">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-gameover" class="records-block hidden">
          <form id="record-form" class="record-form hidden">
            <label for="record-name">¡Entras en el top 5! Tu nombre:</label>
            <div class="record-form-row">
              <input id="record-name" type="text" maxlength="12" autocomplete="off" placeholder="Nombre" />
              <button id="record-save-btn" type="submit">Guardar</button>
            </div>
          </form>
          <p id="record-new" class="record-new hidden">¡Nuevo récord!</p>
          <div id="records-table-go"></div>
          <p id="records-stats-go" class="records-stats"></p>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div class="records-block">
          <p class="records-heading">Mejores récords</p>
          <div id="records-table-start"></div>
          <p id="records-stats-start" class="records-stats"></p>
        </div>
        <button id="play-btn" type="button">Jugar</button>
        <button id="reset-records-btn" class="link-btn" type="button">Borrar récords</button>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
